<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="리모컨">
<meta name="theme-color" content="#F3F0FF">
<link rel="apple-touch-icon" href="icon.png">
<title>리모컨</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <span class="dot" id="dot" aria-hidden="true"></span>
  <span class="chip" id="appchip">리모컨</span>
  <span class="sp"></span>
  <button type="button" class="pw" id="pw" aria-label="연결"><svg class="i"><use href="icons.svg#ti-power"></use></svg></button>
</header>

<main>
  <section id="remote" class="view">
    <div class="rtop" id="rtop"></div>
    <div class="rpad" id="rpad"><p class="hint">밀어서 넘기기 · 두 손가락 위아래로 소리</p></div>
    <div class="rbig" id="rbig"></div>
  </section>

  <section id="deck" class="view">
    <div class="deckin" id="deckin"></div>
  </section>

  <section id="att" class="view">
    <div class="tt" id="tt"></div>
    <div class="attbar">
      <select id="cls" aria-label="반"></select>
      <span id="attinfo"></span>
    </div>
    <div class="roster" id="roster"></div>
    <div class="attfoot">
      <span id="attsum"></span>
      <button type="button" class="attsave" id="attsave">저장</button>
    </div>
  </section>

  <section id="files" class="view">
    <div class="fbtns">
      <label class="fbig main"><svg class="i"><use href="icons.svg#ti-camera"></use></svg>사진 찍기<input type="file" id="fcam" accept="image/*" capture="environment" hidden></label>
      <label class="fbig"><svg class="i"><use href="icons.svg#ti-upload"></use></svg>사진·파일 보내기<input type="file" id="fpick" multiple hidden></label>
    </div>
    <div class="fprog" id="fprog" hidden><div class="fbar"><i id="fbar"></i></div><span id="fprogText"></span></div>
    <div class="fhead"><h3>PC에서 받기</h3><button type="button" id="frefresh" aria-label="새로고침"><svg class="i"><use href="icons.svg#ti-refresh"></use></svg></button></div>
    <div class="flist" id="flist"></div>
  </section>

  <section id="wait" class="view msg">
    <div class="msgcard">
      <p id="waitText">연결하는 중</p>
      <button type="button" class="again" id="again" hidden>다시 연결</button>
    </div>
  </section>
</main>

<nav class="bar" role="tablist">
  <button type="button" class="tab on" data-tab="remote" role="tab" aria-selected="true"><svg class="i"><use href="icons.svg#ti-device-remote"></use></svg><span>리모컨</span></button>
  <button type="button" class="tab" data-tab="deck" role="tab" aria-selected="false"><svg class="i"><use href="icons.svg#ti-layout-grid"></use></svg><span>단추</span></button>
  <button type="button" class="tab" data-tab="att" role="tab" aria-selected="false"><svg class="i"><use href="icons.svg#ti-clipboard-check"></use></svg><span>출결</span></button>
  <button type="button" class="tab" data-tab="files" role="tab" aria-selected="false"><svg class="i"><use href="icons.svg#ti-photo"></use></svg><span>파일</span></button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="shade" data-s="close"></div>
  <div class="panel" role="dialog" aria-label="연결">
    <button type="button" class="row" data-s="off">연결 끊기</button>
    <button type="button" class="row warn" data-s="forget">이 기기 연결 지우기</button>
    <button type="button" class="row muted" data-s="close">닫기</button>
  </div>
</div>
<div class="sheet" id="memo" hidden>
  <div class="shade" data-m="close"></div>
  <div class="panel memo" role="dialog" aria-label="메모">
    <h3 id="memoWho"></h3>
    <div class="chips">
      <button type="button" data-m="chip">발표</button>
      <button type="button" data-m="chip">질문</button>
      <button type="button" data-m="chip">과제 안 냄</button>
      <button type="button" data-m="chip">준비물 안 가져옴</button>
      <button type="button" data-m="chip">도움을 줌</button>
    </div>
    <textarea id="memoText" rows="3" placeholder="메모"></textarea>
    <div class="memobtns">
      <button type="button" class="row muted" data-m="close">닫기</button>
      <button type="button" class="row ok" data-m="save">남기기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
